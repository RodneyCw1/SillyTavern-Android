name: Check public Android source
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .local/android-sdk
            .local/gradle-8.13
            .local/gradle-cache
            .local/downloads
            .local/npm-cache
          key: android-windows-node22-ndk28-${{ hashFiles('docs/runtime-bundle.json', 'package-lock.json', 'server/package-lock.json') }}
      - name: Setup pinned tools and dependencies
        shell: pwsh
        run: ./scripts/setup-sdk.ps1
      - name: Verify source and test core
        shell: pwsh
        run: |
          node scripts/check-public-source.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source audit failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
      - name: Import verified native runtime
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1
      - name: Build and test unsigned development app
        shell: pwsh
        run: |
          node scripts/prepare-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging failed' }
          . ./scripts/environment.ps1
          & .local/gradle-8.13/bin/gradle.bat -p android testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Android checks failed' }
